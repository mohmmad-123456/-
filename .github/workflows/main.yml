name: Build consent camera APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test consent request bot without connecting to Telegram
        working-directory: bot
        run: python -m unittest -v

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: ConsentCamera-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
